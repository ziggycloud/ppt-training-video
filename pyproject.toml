[project]
name = "ppt-training-video"
version = "0.1.0"
description = "Low-cost PPT-to-training-video CLI with Alibaba Cloud Bailian vision and speech APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pypdfium2>=4.30,<6",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
]

[project.scripts]
ppt-trainer = "ppt_trainer.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "respx>=0.22,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppt_trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: invokes LibreOffice and FFmpeg"]

[tool.ruff]
line-length = 100
